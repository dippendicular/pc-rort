[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrort"
version = "0.3.0"
description = "Provenance-Constrained Risk-Optimal Relation Transport for personalized federated learning"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Dip Chakraborty"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "cvxpy>=1.5",
    "pandas>=2",
    "scikit-learn>=1.3",
    "PyYAML>=6",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
multimodal = ["torch>=2", "torchvision>=0.15", "timm>=0.9", "seaborn>=0.12", "tqdm>=4", "flwr>=1.5"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
       "sqlalchemy>=2", "psycopg[binary]>=3.2", "alembic>=1.13", "passlib[bcrypt]>=1.7", "PyJWT>=2.9",
       "celery[redis]>=5.4", "boto3>=1.35", "slowapi>=0.1", "pydantic-settings>=2.4", "pillow>=10"]

[project.scripts]
pcrort = "pcrort.cli:main"

[tool.setuptools.packages.find]
include = ["pcrort*"]

[tool.setuptools.package-data]
"pcrort.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
